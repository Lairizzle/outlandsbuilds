{{ define "main" }}
  <div class="container admin-page">
    <h1>{{ .Title }}</h1>

    <div id="login-box">
      <div class="form-group">
        <label for="admin-password">Password</label>
        <input type="password" id="admin-password" />
      </div>
      <button id="login-btn" class="button button-primary">View Submissions</button>
      <p id="login-error" class="admin-error" style="display:none;">Incorrect password.</p>
    </div>

    <div id="submissions-panel" style="display:none;">
      <div class="admin-toolbar">
        <div class="admin-filters">
          <button class="admin-filter-btn active" data-filter="all">All</button>
          <button class="admin-filter-btn" data-filter="pending">Pending</button>
          <button class="admin-filter-btn" data-filter="approved">Approved</button>
          <button class="admin-filter-btn" data-filter="rejected">Rejected</button>
        </div>
        <span id="admin-count" class="admin-count"></span>
      </div>
      <div id="submissions-list"></div>
    </div>
  </div>

  <script>
    let storedPassword = "";
    let allSubmissions = [];
    let currentFilter = "all";

    function escapeHtml(str) {
      if (str == null) return "";
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function renderSubmissions() {
      const listEl = document.getElementById("submissions-list");
      const countEl = document.getElementById("admin-count");

      const filtered =
        currentFilter === "all"
          ? allSubmissions
          : allSubmissions.filter((s) => s.status === currentFilter);

      countEl.textContent = `${filtered.length} submission${filtered.length === 1 ? "" : "s"}`;

      if (filtered.length === 0) {
        listEl.innerHTML = "<p class='admin-empty'>Nothing here.</p>";
        return;
      }

      listEl.innerHTML = filtered
        .map(
          (s) => `
    <div class="admin-submission" data-id="${s.id}">
      <div class="admin-submission-header">
        <div>
          <strong>${escapeHtml(s.build_name)}</strong>
          <span class="admin-status admin-status-${s.status}">${escapeHtml(s.status)}</span>
        </div>
        <span class="admin-meta">#${s.id} · ${escapeHtml(s.created_at)}</span>
      </div>

      <p class="admin-meta">${escapeHtml(s.name)}${s.email ? " · " + escapeHtml(s.email) : ""}</p>

      <details class="admin-writeup">
        <summary>Writeup</summary>
        <pre class="admin-writeup-content">${escapeHtml(s.writeup)}</pre>
      </details>

      ${
        s.csv_content
          ? `
        <details class="admin-writeup">
          <summary>Build Card CSV${s.csv_filename ? " — " + escapeHtml(s.csv_filename) : ""}</summary>
          <pre class="admin-writeup-content">${escapeHtml(s.csv_content)}</pre>
        </details>
      `
          : `<p class="admin-meta admin-no-csv">No CSV submitted</p>`
      }

      <div class="admin-actions">
        <button class="button admin-approve" data-id="${s.id}">Approve</button>
        <button class="button admin-reject" data-id="${s.id}">Reject</button>
        <button class="button admin-delete" data-id="${s.id}">Delete</button>
      </div>
    </div>
  `,
        )
        .join("");

      listEl
        .querySelectorAll(".admin-approve")
        .forEach((btn) =>
          btn.addEventListener("click", () => updateStatus(btn.dataset.id, "approved")),
        );
      listEl
        .querySelectorAll(".admin-reject")
        .forEach((btn) =>
          btn.addEventListener("click", () => updateStatus(btn.dataset.id, "rejected")),
        );
      listEl
        .querySelectorAll(".admin-delete")
        .forEach((btn) => btn.addEventListener("click", () => deleteSubmission(btn.dataset.id)));
    }

    async function fetchSubmissions() {
      const formData = new FormData();
      formData.append("password", storedPassword);

      const res = await fetch("/api/list", { method: "POST", body: formData });
      if (!res.ok) return;

      const data = await res.json();
      allSubmissions = data.submissions;
      renderSubmissions();
    }

    async function updateStatus(id, status) {
      const formData = new FormData();
      formData.append("password", storedPassword);
      formData.append("id", id);
      formData.append("status", status);

      await fetch("/api/update-status", { method: "POST", body: formData });
      fetchSubmissions();
    }

    async function deleteSubmission(id) {
      if (!confirm("Delete this submission permanently?")) return;

      const formData = new FormData();
      formData.append("password", storedPassword);
      formData.append("id", id);

      await fetch("/api/delete", { method: "POST", body: formData });
      fetchSubmissions();
    }

    document.querySelectorAll(".admin-filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".admin-filter-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderSubmissions();
      });
    });

    document.getElementById("login-btn").addEventListener("click", async () => {
      const password = document.getElementById("admin-password").value;
      const errorEl = document.getElementById("login-error");

      const formData = new FormData();
      formData.append("password", password);

      const res = await fetch("/api/list", { method: "POST", body: formData });

      if (!res.ok) {
        errorEl.style.display = "block";
        return;
      }

      errorEl.style.display = "none";
      storedPassword = password;

      document.getElementById("login-box").style.display = "none";
      document.getElementById("submissions-panel").style.display = "block";

      allSubmissions = (await res.json()).submissions;
      renderSubmissions();
    });
  </script>
{{ end }}

{{ define "main" }}
  <header class="page-header container submit-header">
    <h1>{{ .Title }}</h1>
    <p>Submit your build for review — fill out the details below.</p>
  </header>

  <div class="container">
    <form class="submit-form" action="/api/submit" method="POST">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="form-group">
        <label for="email">
          Email
          <span class="field-optional">(optional)</span>
        </label>
        <input type="email" id="email" name="email" />
      </div>

      <div class="form-group">
        <label for="build_name">Build Name</label>
        <input type="text" id="build_name" name="build_name" required />
      </div>

      <div class="form-group">
        <label for="writeup">Writeup</label>
        <textarea id="writeup" name="writeup" rows="24" required>
    Description:


    Build Type (Dexxer, Tank, Caster, Archer, etc.):


    Categories (PvM, PvP, Farming, Anti-PK, Group):


    Tags (skills, activities, playstyles):


    Investment Rating (1-5, Very Low to Very High):


    Chain Links Rating (1-5, Optional to Link Dependent):


    Difficulty (Low, Medium, High):


    Skills:


    Overview:
    (Primary purpose, playstyle, major strengths, weaknesses/limitations, key mechanics, solo/group performance)


    Aspect Options:
    (Preferred Aspect + weapon/armor combo, alternatives, when to use them)


    Link Options:
    (Priority links, secondary/optional links, performance without maxed links, grouped by use case)


    Codex Use:
    (Stances, finishers, specials, weapon abilities, key combinations, situational abilities — organized by skill)


    Equipment:
    (Weapons, armor, weapon types)


    Farming / Gameplay:
    (Farming locations, PvM/PvP/Anti-PK performance, solo/group performance, income, tips)


    Additional Notes:
    (Special interactions, budget considerations, alternative playstyles, warnings)


    Stats:
    STR: , INT: , DEX: 
    </textarea>
      </div>
      <div class="form-group">
        <label for="csv_filename">
          CSV Filename
          <span class="field-optional">(optional)</span>
        </label>
        <input type="text" id="csv_filename" name="csv_filename" placeholder="results.csv" />
      </div>

      <div class="form-group">
        <label for="csv_content">
          Paste CSV Contents
          <span class="field-optional">(optional)</span>
        </label>
        <textarea
          id="csv_content"
          name="csv_content"
          rows="16"
          class="mono"
          placeholder="col1,col2,col3&#10;val1,val2,val3"
        ></textarea>
      </div>

      <div class="cf-turnstile" data-sitekey="0x4AAAAAAEvmrUr8O6ln_y5k"></div>

      <button type="submit" class="button button-primary">Submit Build</button>
    </form>
  </div>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{{ end }}

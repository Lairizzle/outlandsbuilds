{{ define "main" }}
  <header class="page-header container submit-header">
    <h1>{{ .Title }}</h1>
    <p>Submit your build for review — fill out the details below.</p>
  </header>

  <div class="container">
    <form class="submit-form" action="/api/submit" method="POST">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="form-group">
        <label for="email">
          Email
          <span class="field-optional">(optional)</span>
        </label>
        <input type="email" id="email" name="email" />
      </div>

      <div class="form-group">
        <label for="build_name">Build Name</label>
        <input type="text" id="build_name" name="build_name" required />
      </div>

      <div class="form-group">
        <label for="writeup">Writeup</label>
        <textarea id="writeup" name="writeup" rows="24" required>
        Description:
        [1–2 sentences describing the build and what it is best suited for]


        Build Type:
        [Dexxer, Tank, Caster, Archer, etc.]


        Tags:
        [PvM, PvP, Farming, Anti-PK, Group, etc.]

        Investment Rating:
        [1–5]
        [1 = Very Low, 5 = Very High]


        Chain Links Rating:
        [1–5]
        [1 = Optional, 5 = Link Dependent]


        Difficulty:
        [Low, Medium, High]


        Overview:
        - What is the primary purpose of the build?
        - What is the general playstyle?
        - What are its main strengths and weaknesses?
        - What are the key mechanics?
        - How does it perform solo vs. group?


        Aspect Options:
        - PvM:
          - Weapon:
          - Armor:
          - Alternatives:

        - PvP:
          - Weapon:
          - Armor:
          - Alternatives:


        Link Options:
        - Priority Links:
        - Secondary / Optional Links:
        - How does the build perform without maxed links?


        Codex Use:
        - Codex:
          - Stances:
          - Finishers:
          - Specials:
          - Weapon Abilities:
          - Situational Abilities:


        Equipment:
        - Weapons:
        - Armor:
        - Weapon Types:


        Farming / Gameplay:
        - Recommended Farming Locations:
        - PvM Performance:
        - PvP Performance:
        - Anti-PK Performance:
        - Solo / Group Performance:
        - Income:


        Additional Notes:
        - Special Interactions:
        - Budget Considerations:
        - Alternative Options:
        - Other Tips:


        Stats:
        STR:
        INT:
        DEX:
    </textarea>
      </div>

      <div class="form-group">
        <label for="csv_content">
          Paste CSV Contents
          <span class="field-optional">(optional)</span>
        </label>
        <textarea
          id="csv_content"
          name="csv_content"
          rows="16"
          class="mono"
          placeholder="You can paste the contents of your Outlands Butler exported CSV here."
        ></textarea>
      </div>

      <div class="cf-turnstile" data-sitekey="0x4AAAAAAEvmrUr8O6ln_y5k"></div>

      <button type="submit" class="button button-primary">Submit Build</button>
    </form>
  </div>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{{ end }}

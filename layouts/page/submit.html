{{ define "main" }}
  <header class="page-header container submit-header">
    <h1>{{ .Title }}</h1>
    <p>Submit your build for review — fill out the details below.</p>
  </header>

  <div class="container">
    <form class="submit-form" action="/api/submit" method="POST">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="form-group">
        <label for="email">
          Email
          <span class="field-optional">(optional)</span>
        </label>
        <input type="email" id="email" name="email" />
      </div>

      <div class="form-group">
        <label for="build_name">Build Name</label>
        <input type="text" id="build_name" name="build_name" required />
      </div>

      <div class="form-group">
        <label for="writeup">Writeup</label>
        <textarea id="writeup" name="writeup" rows="24" required>
    Description:


    Build Type:
    - Dexxer, Tank, Caster, Archer, etc.


    Categories:
    -PvM, PvP, Farming, Anti-PK, Group


    Tags:
    Skills, Activities, Playstyles


    Investment Rating:
    - 1-5, Very Low to Very High


    Chain Links Rating:
    - 1-5, Optional to Link Dependent


    Difficulty:
    - Low, Medium, High


    Overview:
    - Primary purpose, playstyle, major strengths, weaknesses/limitations, 
    - key mechanics, solo/group performance


    Aspect Options:
    - Preferred Aspect + weapon/armor combo
    - Alternatives and when to use them


    Link Options:
    - Priority links, 
    - Secondary/optional links, 
    - Performance without maxed links


    Codex Use:
    - Stances, finishers, specials, weapon abilities, 
    - Key combinations, situational abilities

    Equipment:
    - Weapons
    - Armor 
    - Weapon types


    Farming / Gameplay:
    - Farming locations
    - PvM/PvP/Anti-PK performance
    - Solo/group performance
    - Income

    Additional Notes:
    - Special interactions
    - Budget considerations


    Stats:
    STR, INT, DEX 
    </textarea>
      </div>

      <div class="form-group">
        <label for="csv_content">
          Paste CSV Contents
          <span class="field-optional">(optional)</span>
        </label>
        <textarea
          id="csv_content"
          name="csv_content"
          rows="16"
          class="mono"
          placeholder="You can paste the contents of your Outlands Butler exported CSV here."
        ></textarea>
      </div>

      <div class="cf-turnstile" data-sitekey="0x4AAAAAAEvmrUr8O6ln_y5k"></div>

      <button type="submit" class="button button-primary">Submit Build</button>
    </form>
  </div>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{{ end }}

{{ define "main" }}
  <header class="page-header container submit-header">
    <h1>{{ .Title }}</h1>
    <p>Submit your build for review — fill out the details below.</p>
  </header>

  <div class="container">
    <form class="submit-form" action="/api/submit" method="POST">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="form-group">
        <label for="email">
          Email
          <span class="field-optional">(optional)</span>
        </label>
        <input type="email" id="email" name="email" />
      </div>

      <div class="form-group">
        <label for="build_name">Build Name</label>
        <input type="text" id="build_name" name="build_name" required />
      </div>

      <div class="form-group">
        <label for="writeup">Writeup</label>
        <textarea id="writeup" name="writeup" rows="24" required>
    Description:


    Build Type:
    - Dexxer, Tank, Caster, Archer, etc.


    Categories:
    -PvM, PvP, Farming, Anti-PK, Group


    Tags:
    Skills, Activities, Playstyles


    Investment Rating:
    - 1-5, Very Low to Very High


    Chain Links Rating:
    - 1-5, Optional to Link Dependent


    Difficulty:
    - Low, Medium, High


    Overview:
    - Primary purpose, playstyle, major strengths, weaknesses/limitations, 
    - key mechanics, solo/group performance


    Aspect Options:
    - Preferred Aspect + weapon/armor combo
    - Alternatives and when to use them


    Link Options:
    - Priority links, 
    - Secondary/optional links, 
    - Performance without maxed links


    Codex Use:
    - Stances, finishers, specials, weapon abilities, 
    - Key combinations, situational abilities

    Equipment:
    - Weapons
    - Armor 
    - Weapon types


    Farming / Gameplay:
    - Farming locations
    - PvM/PvP/Anti-PK performance
    - Solo/group performance
    - Income

    Additional Notes:
    - Special interactions
    - Budget considerations


    Stats:
    STR, INT, DEX 
    </textarea>
      </div>

      <div class="form-group">
        <label for="csv_file">
          Upload CSV
          <span class="field-optional">(optional)</span>
        </label>
        <input type="file" id="csv_file" accept=".csv,text/csv" />
      </div>

      <input type="hidden" id="csv_content" name="csv_content" />

      <div class="cf-turnstile" data-sitekey="0x4AAAAAAEvmrUr8O6ln_y5k"></div>

      <button type="submit" class="button button-primary">Submit Build</button>
    </form>
  </div>

  <script>
    (function () {
      const MAX_CSV_CHARS = 50000; // matches backend limit

      const fileInput = document.getElementById("csv_file");
      const contentField = document.getElementById("csv_content");

      fileInput.addEventListener("change", function () {
        const file = fileInput.files[0];
        if (!file) return;

        const reader = new FileReader();

        reader.onload = function (event) {
          const text = event.target.result;

          if (text.length > MAX_CSV_CHARS) {
            alert(
              "That file is too large (max " +
                MAX_CSV_CHARS.toLocaleString() +
                " characters). Please choose a smaller file.",
            );
            fileInput.value = "";
            contentField.value = "";
            return;
          }

          contentField.value = text;
        };

        reader.onerror = function () {
          alert("Couldn't read that file. Please try again.");
          contentField.value = "";
        };

        reader.readAsText(file);
      });
    })();
  </script>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{{ end }}

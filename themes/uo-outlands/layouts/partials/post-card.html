<a class="post-card" href="{{ .RelPermalink }}">

  <time>
    {{ .Date.Format "Jan 02, 2006" }}
  </time>


  <div>

    <h3>
      {{ .Title }}
    </h3>

    <p>
      {{ .Description | default .Summary | plainify | truncate 180 }}
    </p>

  </div>


  <span class="card-arrow">
    →
  </span>

</a>
